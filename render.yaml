services:
  - type: web
    name: gym-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GYM_APP_PIN
        value: "1208"
      - key: NTFY_TOPIC
        value: "gym-rest-alerts-9988"
      - key: DATABASE_URL
        fromDatabase:
          name: gym-db
          property: connectionString

databases:
  - name: gym-db
    databaseName: gym
    user: gym_admin
    plan: free
